name: CI

# PR 与非主分支 push 时只做构建验证和测试，不部署；
# main 分支的 push 由 deploy.yml 负责（含同样的检查 + 部署）。
on:
  pull_request:
    branches: [ main ]
  push:
    branches-ignore: [ main ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install, test and build
      # 仓库无 lock 文件，用 npm install；
      # npm run check = node --test 单元测试 + scripts/check.mjs 静态检查
      run: |
        npm install
        npm run check
        npm run build
