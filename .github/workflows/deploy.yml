name: Deploy Pet MBTI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Test and build static site
      # 先跑完整检查（node --test 单元测试 + scripts/check.mjs 静态检查），
      # 通过后才构建部署，避免把坏代码发上线。
      run: |
        npm install
        npm run check
        npm run build

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "dist/*"
        target: "/var/www/pet-mbti/"
        strip_components: 1

    - name: Notify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "✅ Pet MBTI deployed to /var/www/pet-mbti/"

    - name: Verify online deployment
      # 部署后真实探测线上站点，失败会让工作流标红（而不是静默假成功）
      run: |
        set -e
        for attempt in 1 2 3 4 5; do
          if curl --connect-timeout 10 --max-time 20 -fsS https://pet.richardq.tech > /dev/null; then
            echo "✅ https://pet.richardq.tech 健康检查通过"
            exit 0
          fi
          echo "等待线上就绪（第 $attempt 次）..."
          sleep "$attempt"
        done
        echo "❌ 线上健康检查失败：https://pet.richardq.tech"
        exit 1

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then
          RESULT="成功"; LEVEL="active"; SOUND="minuet"; GROUP="CI/CD · 成功"
        else
          RESULT="失败"; LEVEL="timeSensitive"; SOUND="alarm"; GROUP="CI/CD · 失败"
        fi
        jq -n \
          --arg key "$BARK_KEY" \
          --arg title "部署$RESULT · Pet MBTI" \
          --arg body "分支：${{ github.ref_name }} · 提交：${GITHUB_SHA:0:7} · 点击查看运行详情" \
          --arg group "$GROUP" \
          --arg level "$LEVEL" \
          --arg sound "$SOUND" \
          --arg id "cicd-${{ github.repository_id }}-deploy" \
          --arg icon "https://stats.richardq.tech/icon-pet-mbti.png" \
          --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '{device_key:$key,title:$title,subtitle:"GitHub Actions",body:$body,group:$group,level:$level,sound:$sound,id:$id,icon:$icon,url:$url,isArchive:"1"}' \
          | curl -fsS -m 10 -X POST "https://api.day.app/push" \
              -H "Content-Type: application/json; charset=utf-8" -d @- \
          || echo "Bark 通知发送失败（不影响构建）"
