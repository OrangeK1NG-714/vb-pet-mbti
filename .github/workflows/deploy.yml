name: Deploy Pet MBTI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Build static site
      run: |
        npm install
        npm run build

    - name: Deploy to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "dist/*"
        target: "/var/www/pet-mbti/"
        strip_components: 1

    - name: Notify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          echo "✅ Pet MBTI deployed to /var/www/pet-mbti/"

    - name: Bark 通知
      if: always()
      env:
        BARK_KEY: ${{ secrets.BARK_KEY }}
      run: |
        if [ -z "$BARK_KEY" ]; then echo "BARK_KEY 未配置，跳过通知"; exit 0; fi
        if [ "${{ job.status }}" = "success" ]; then ICON="✅"; else ICON="❌"; fi
        curl -fsS -m 10 -X POST "https://api.day.app/push" \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "{\"device_key\":\"$BARK_KEY\",\"title\":\"$ICON ${{ github.repository }}\",\"body\":\"${{ github.workflow }} · ${{ github.ref_name }} · ${{ job.status }} · ${GITHUB_SHA:0:7}\",\"group\":\"GitHub CI\",\"icon\":\"https://stats.richardq.tech/icons/pet-mbti.png\",\"url\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          || echo "Bark 通知发送失败（不影响构建）"
