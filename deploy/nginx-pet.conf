server {
    listen 80;
    server_name pet.richardq.tech;
    root /var/www/pet-mbti;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name pet.richardq.tech;

    ssl_certificate /root/.acme.sh/pet.richardq.tech_ecc/fullchain.cer;
    ssl_certificate_key /root/.acme.sh/pet.richardq.tech_ecc/pet.richardq.tech.key;

    root /var/www/pet-mbti;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; frame-ancestors 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.richardq.tech; manifest-src 'self'; worker-src 'self' blob:" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
